name: Backend CI

on:
  push:
    paths: ["backend/**", "requirements.txt", "api/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "requirements.txt", "api/**", ".github/workflows/backend-ci.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff, migrations, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: careerlens
          POSTGRES_DB: careerlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerlens -d careerlens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://careerlens:careerlens@localhost:5432/careerlens_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Validate database migrations (upgrade on empty Postgres)
        env:
          DATABASE_URL: postgresql://careerlens:careerlens@localhost:5432/careerlens_test
        run: alembic upgrade head && alembic current
      - name: Pytest (unit + API integration, on Postgres) with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
