name: End-to-end (Playwright)

on:
  pull_request:
    paths: ["frontend/**", "backend/**", "requirements.txt", "api/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./e2e.db
      JWT_SECRET: e2e-only-secret-e2e-only-secret-0123456789
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - name: Run Playwright (Vite dev server proxies /api to the API)
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://127.0.0.1:5173 npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            web.log
