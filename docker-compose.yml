# Development stack. Requires a `.env` file (copy .env.example).
#   docker compose up --build
# App: http://localhost:8080 (nginx -> frontend build + /api proxy). API docs: http://localhost:8000/api/docs
# For frontend hot reload run `npm run dev` in frontend/ instead of using the frontend container.
name: careerlens-dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerlens}
      POSTGRES_DB: ${POSTGRES_DB:-careerlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerlens}:${POSTGRES_PASSWORD:-careerlens}@db:5432/${POSTGRES_DB:-careerlens}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
